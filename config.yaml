# Ruoli da cercare (anche varianti e titoli simili, in italiano e inglese)
ruoli:
  - Service Designer
  - UX Designer
  - Service & UX Designer
  - CX Designer / Customer Experience Designer
  - Design Researcher
  - UX Researcher
  - Product-Service System Designer
  - Design Strategist
  - Interaction Designer

tipo_posizione: [junior, stage, tirocinio, internship]

localita:
  - Emilia-Romagna (in sede, ibrido o remoto) — priorità
  - Italia (in sede, ibrido o remoto)
  - Remoto Europa

lingue_ammesse: [italiano, inglese]

# Scarta gli annunci che contengono queste parole nel titolo
escludi:
  - senior
  - lead
  - head of
  - director
  - manager
  - graphic designer print
  - interior designer

# Settori preferiti (aumentano il punteggio) — dedotti dai progetti in
# portfolio di Alice (vedi profilo.md), da confermare/aggiornare
settori_preferiti: [impatto sociale, sicurezza urbana, consumer tech, wearable, edtech]

